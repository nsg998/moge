<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨阁 · 小说创作工作台</title>
<style>
  :root{ --paper:#fffdf8; --ink:#2c2a26; --sub:#8a857c; --accent:#7a5c3e; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:#e9e5de; color:var(--ink);
        font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  /* 手机优先布局：电脑上居中显示一竖条，模拟手机屏 */
  #app{ max-width:560px; margin:0 auto; height:100vh; display:flex;
        flex-direction:column; background:var(--paper); box-shadow:0 0 30px rgba(0,0,0,.08); }
  header{ display:flex; justify-content:space-between; align-items:center;
          padding:10px 16px; border-bottom:1px solid #eee8dd; }
  .title{ font-weight:700; font-size:17px; letter-spacing:2px; }
  .ver{ font-size:11px; color:var(--sub); font-weight:400; margin-left:4px; }
  .badges{ display:flex; gap:6px; }
  .badge{ font-size:11px; padding:3px 8px; border-radius:99px; background:#eee; color:var(--sub); }
  .badge.ok{ background:#e8f3e6; color:#2e6b2a; }
  .badge.bad{ background:#fdeaea; color:#a33; }
  #fatal{ padding:12px 16px; background:#a33; color:#fff; font-size:13px; }
  main{ flex:1; display:flex; min-height:0; }
  #editor{ flex:1; border:0; outline:0; resize:none; padding:18px 20px 30px;
           font-size:17px; line-height:1.9; background:transparent; font-family:inherit; }
  #statusbar{ display:flex; align-items:center; gap:10px; padding:8px 16px;
              border-top:1px solid #eee8dd; font-size:12px; color:var(--sub); }
  #btnExport{ margin-left:auto; border:1px solid var(--accent); background:transparent;
              color:var(--accent); border-radius:6px; padding:5px 12px; font-size:12px; }
  #tabbar{ display:flex; border-top:1px solid #eee8dd; background:#fbf9f4; }
  .tab{ flex:1; padding:10px 0 12px; border:0; background:transparent; font-size:12px; color:var(--sub); }
  .tab.active{ color:var(--accent); font-weight:600; }
  #toast{ position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
          background:rgba(44,42,38,.92); color:#fff; padding:8px 16px; border-radius:8px;
          font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">墨阁<span class="ver">v0.1.0</span></div>
    <div class="badges">
      <div class="badge" id="dbBadge">存储检测中…</div>
      <div class="badge" id="persistBadge">防清理：待申请</div>
    </div>
  </header>
  <div id="fatal" hidden></div>
  <main><textarea id="editor" placeholder="在这里写下第一句……"></textarea></main>
  <div id="statusbar">
    <span id="status">待命</span><span id="count">0 字</span>
    <button id="btnExport">导出 txt</button>
  </div>
  <nav id="tabbar">
    <button class="tab active">✍️ 写作</button>
    <button class="tab" data-msg="📚 多章节书架将在第 2 步开放">📚 作品</button>
    <button class="tab" data-msg="🗂 人物卡/设定卡将在第 3 步开放">🗂 卡片</button>
    <button class="tab" data-msg="⚙️ 设置（含 AI 插座）将在后续开放">⚙️ 设置</button>
  </nav>
</div>
<div id="toast"></div>

<script>
/* ================= 稿子保险柜（IndexedDB 浏览器本地数据库） ================= */
const DB='moge_db', STORE='docs', KEY='draft';
let dbPromise=null, saveTimer=null;

function openDB(){ return new Promise((ok,no)=>{
  const req=indexedDB.open(DB,1);
  req.onupgradeneeded=e=>{ const db=e.target.result;
    if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
  req.onsuccess=e=>ok(e.target.result); req.onerror=e=>no(e.target.error);
});}
function saveDraft(text){ return new Promise((ok,no)=>{
  const tx=dbPromise.transaction(STORE,'readwrite');
  tx.objectStore(STORE).put({text,updatedAt:Date.now()},KEY);
  tx.oncomplete=ok; tx.onerror=()=>no(tx.error);
});}
function loadDraft(){ return new Promise((ok,no)=>{
  const tx=dbPromise.transaction(STORE,'readonly');
  const r=tx.objectStore(STORE).get(KEY);
  r.onsuccess=()=>ok(r.result||null); r.onerror=()=>no(r.error);
});}

/* ================= 界面小工具 ================= */
const $=id=>document.getElementById(id);
const editor=$('editor'), status=$('status'), count=$('count');
let toastTimer;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity=0,2200); }
function now(){ return new Date().toLocaleTimeString('zh-CN',{hour12:false}); }
function updateCount(){ count.textContent=editor.value.length.toLocaleString()+' 字'; }

/* ================= 自动保存（停手半秒后落库） ================= */
async function flushSave(){
  status.textContent='保存中…';
  try{ await saveDraft(editor.value); status.textContent='已保存 '+now(); }
  catch(e){ status.textContent='⚠️ 保存失败，请导出备份并告诉我'; }
}
editor.addEventListener('input',()=>{ updateCount(); status.textContent='未保存…';
  clearTimeout(saveTimer); saveTimer=setTimeout(flushSave,500); });
/* 切走页面时立即补一枪，防手滑 */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });

/* ================= 导出备份 ================= */
$('btnExport').addEventListener('click',()=>{
  if(!editor.value.trim()){ toast('先写点什么再导出吧'); return; }
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const name='墨阁备份-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.txt';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([editor.value],{type:'text/plain;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
  toast('已导出：'+name);
});

/* ================= 占位导航 ================= */
document.querySelectorAll('.tab[data-msg]').forEach(b=>
  b.addEventListener('click',()=>toast(b.dataset.msg)));

/* ================= 启动：检测→恢复稿子→申请防清理权限 ================= */
(async function init(){
  if(!('indexedDB' in window)){
    $('dbBadge').className='badge bad'; $('dbBadge').textContent='存储不可用';
    $('fatal').hidden=false; $('fatal').textContent='这个浏览器不支持本地存储，换 Edge / Chrome / Firefox 再试，并把浏览器名字告诉我。';
    editor.disabled=true; return;
  }
  try{ dbPromise=await openDB(); }
  catch(e){
    $('dbBadge').className='badge bad'; $('dbBadge').textContent='存储不可用';
    $('fatal').hidden=false; $('fatal').textContent='保险柜打不开：'+e+'。请告诉我这个报错。';
    editor.disabled=true; return;
  }
  const b=$('dbBadge'); b.className='badge ok'; b.textContent='保险柜已就绪 ✓';
  const doc=await loadDraft();
  if(doc && doc.text){ editor.value=doc.text; updateCount(); status.textContent='上次保存于 '+new Date(doc.updatedAt).toLocaleString('zh-CN',{hour12:false}); }
  /* 向浏览器申请"不许自动清理我的数据"（file 本地环境申请不到，上架后有正式网址才会成功） */
  try{
    if(navigator.storage && navigator.storage.persist){
      const granted=await navigator.storage.persist();
      const p=$('persistBadge');
      if(granted){ p.className='badge ok'; p.textContent='防清理：已授予 ✓'; }
      else{ p.textContent='防清理：暂未授予'; }
    }else{ $('persistBadge').textContent='防清理：本环境不支持'; }
  }catch(e){ $('persistBadge').textContent='防清理：上架后申请'; }
})();
</script>
</body>
</html>
